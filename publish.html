{% extends 'base.html' %}{% block content %}<div class="form-panel"><p class="eyebrow">SELL SOMETHING</p><h1>发布一件闲置</h1><p class="muted">填写信息，让有需要的同学发现它。</p><form method="post" enctype="multipart/form-data" class="product-form"><label>商品名称<input name="title" required placeholder="例如：数据结构教材"></label><label>分类<select name="category" required><option value="教材">教材</option><option value="数码">数码</option><option value="生活用品">生活用品</option><option value="其他">其他</option></select></label><label>价格（元）<input name="price" type="number" min="0" step="0.01" required placeholder="0.00"></label><label>商品描述<textarea name="description" rows="4" placeholder="介绍新旧程度、交易地点等"></textarea></label><label>联系方式<input name="contact" required placeholder="微信号或手机号"></label><label>商品图片<input name="image" type="file" accept="image/*"><small class="field-help">支持 JPG、PNG 等图片；图片会保存到 static/uploads 文件夹。</small></label><button class="submit-btn">立即发布</button></form></div>{% endblock %}
